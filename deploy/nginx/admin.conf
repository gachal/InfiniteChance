# admin-web(管理后台)运行时配置:静态托管构建产物,并把后端 API 反代到
# 同源路径——与 dev 代理(vite.config.ts)同形:
#   /api/*        → gateway:8080/*(鉴权与网关管理 API)
#   /canvas-api/* → canvas:8081/*(画布/素材管理 API)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 安全响应头(静态面;API 面由 Go 服务自己加)。nginx 的 add_header
  # 不跨层继承:location 里另加头时需重复这三行。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 上游同步调用(视频反推提示词等长请求)可能超过缺省 60s 读超时。
  proxy_read_timeout 300s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://gateway:8080/;
  }

  location /canvas-api/ {
    proxy_pass http://canvas:8081/;
  }

  # Vite 产物文件名带内容哈希:长缓存一年;index.html 恒回源,发版即生效。
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache";
  }

  # SPA history 路由回退:非静态文件一律交给前端路由。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
