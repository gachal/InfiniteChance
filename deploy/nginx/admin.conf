# admin-web(管理后台)运行时配置:静态托管构建产物,并把后端 API 反代到
# 同源路径——与 dev 代理(vite.config.ts)同形:
#   /api/*        → gateway:8080/*(鉴权与网关管理 API)
#   /canvas-api/* → canvas:8081/*(画布/素材管理 API)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 上游同步调用(视频反推提示词等长请求)可能超过缺省 60s 读超时。
  proxy_read_timeout 300s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://gateway:8080/;
  }

  location /canvas-api/ {
    proxy_pass http://canvas:8081/;
  }

  # SPA history 路由回退:非静态文件一律交给前端路由。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
