# 一键拉起全栈:MySQL + Redis + 两个 Go 服务。
# 前端 dev 服务器不进 compose,见 README:本机 pnpm 启动,经 8080/8081 访问后端。
services:
  mysql:
    image: mysql:8.4
    container_name: infinitechance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: infinitechance
      MYSQL_DATABASE: infinitechance
    # 宿主机 3306 常被本机已有 MySQL 占用,故映射到 3307;容器网络内仍是 3306
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: infinitechance-redis
    # 宿主机 6379 常被本机已有 redis 占用,故映射到 6380;容器网络内仍是 6379
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    build: .
    image: infinitechance/server
    command: ["/app/gateway-server"]
    environment:
      GIN_MODE: release
      PORT: "8080"
      MYSQL_DSN: root:infinitechance@tcp(mysql:3306)/infinitechance?parseTime=true
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  canvas:
    build: .
    image: infinitechance/server
    command: ["/app/canvas-server"]
    environment:
      GIN_MODE: release
      PORT: "8081"
      MYSQL_DSN: root:infinitechance@tcp(mysql:3306)/infinitechance?parseTime=true
      REDIS_ADDR: redis:6379
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
