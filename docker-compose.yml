# 一键拉起全栈:MySQL + Redis + 两个 Go 服务。
# 前端 dev 服务器不进 compose,见 README:本机 pnpm 启动,经 8080/8081 访问后端。

# 两个 Go 服务共享的环境变量与依赖条件(YAML 锚点,各服务按需覆盖)。
# JWT_SECRET 必须两个服务一致,画布才能校验网关签发的管理员会话:
# 未设置时两服务回退到内置开发密钥(internal/config 的唯一字面量);
# 生产部署请在宿主机(或 .env)设置 JWT_SECRET 并开启 JWT_SECRET_REQUIRED=true,
# 后者会在密钥缺失时拒绝启动。
x-app-env: &app-env
  GIN_MODE: release
  MYSQL_DSN: root:infinitechance@tcp(mysql:3306)/infinitechance?parseTime=true
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_SECRET_REQUIRED: ${JWT_SECRET_REQUIRED:-}

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    container_name: infinitechance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: infinitechance
      MYSQL_DATABASE: infinitechance
    # 宿主机 3306 常被本机已有 MySQL 占用,故映射到 3307;容器网络内仍是 3306
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: infinitechance-redis
    # 宿主机 6379 常被本机已有 redis 占用,故映射到 6380;容器网络内仍是 6379
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    build: .
    image: infinitechance/server
    command: ["/app/gateway-server"]
    environment:
      <<: *app-env
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on: *app-depends

  canvas:
    build: .
    image: infinitechance/server
    command: ["/app/canvas-server"]
    environment:
      <<: *app-env
      PORT: "8081"
      # 画布 worker 调网关用:服务级 key 由 .env 提供(管理端创建),
      # 未设置时画布拒绝生成提交并给出明确错误,其余功能不受影响。
      CANVAS_GATEWAY_URL: ${CANVAS_GATEWAY_URL:-http://gateway:8080}
      CANVAS_SERVICE_KEY: ${CANVAS_SERVICE_KEY:-}
      CANVAS_TASK_CONCURRENCY: ${CANVAS_TASK_CONCURRENCY:-}
    ports:
      - "8081:8081"
    depends_on: *app-depends

volumes:
  mysql-data:
